<text class="node-meta" x="1960.0" y="843.0" text-anchor="middle" fill="#536374" font-size="15" data-template="4 × 4 = 16 路">4 × 4 = 16 路</text>
</g>
<g class="block" data-id="adtr" role="button" tabindex="0" aria-label="ADTR1107 ×16，每通道收发前端，查看模块详情"><title>ADTR1107 ×16：阵列每通道一片 ADTR1107。模拟波束赋形后的多通道信号在 RF 域合成，然后由公共 ADC 接收链采样。</title><rect x="1510" y="740" width="240" height="130" rx="2" fill="white" stroke="#087f8c" stroke-width="1.6"/><path d="M1510 744 H1750" stroke="#087f8c" stroke-width="5"/>
