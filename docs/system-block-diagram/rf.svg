<text class="node-sub" x="1630.0" y="815.0" text-anchor="middle" fill="#087f8c" font-size="18" data-template="每通道收发前端">每通道收发前端</text>
<text class="node-meta" x="1630.0" y="843.0" text-anchor="middle" fill="#536374" font-size="15" data-template="TX 放大 / RX 低噪放大">TX 放大 / RX 低噪放大</text>
</g>
<g class="block" data-id="pa_route" role="button" tabindex="0" aria-label="基础直连路径，ADTR1107 ↔ 贴片阵列，查看模块详情"><title>基础直连路径：基础方案：前端连接贴片阵列，无外置 QPA2962。增强方案：外部 RF 开关 → QPA2962 功放 → 环行器 → 天线；接收回波从环行器经旁路返回 ADTR1107，不经过外置 GaN 功放。功放及路由按原始系统图表达，实际装配选项仍需与板级连接确认。</title><rect x="1180" y="740" width="240" height="130" rx="2" fill="white" stroke="#087f8c" stroke-width="1.6"/><path d="M1180 744 H1420" stroke="#087f8c" stroke-width="5"/>
<text class="node-title" x="1300.0" y="783.0" text-anchor="middle" fill="#183249" font-size="22" data-template="{routeTitle}">基础直连路径</text>
<text class="node-sub" x="1300.0" y="815.0" text-anchor="middle" fill="#087f8c" font-size="18" data-template="{routeSub}">ADTR1107 ↔ 贴片阵列</text>
<text class="node-meta" x="1300.0" y="843.0" text-anchor="middle" fill="#536374" font-size="15" data-template="{routeMeta}">不配置外置 QPA2962</text>
</g>
<g class="block" data-id="rf_ant" role="button" tabindex="0" aria-label="阵列天线，8 × 16 贴片阵列，查看模块详情"><title>阵列天线：8×16 贴片与 32×16 波导为项目所述不同整机方案。尺寸和制造验证不由本系统图推导。</title><rect x="840" y="740" width="240" height="130" rx="2" fill="white" stroke="#087f8c" stroke-width="1.6"/><path d="M840 744 H1080" stroke="#087f8c" stroke-width="5"/>
<text class="node-title" x="960.0" y="783.0" text-anchor="middle" fill="#183249" font-size="22" data-template="阵列天线">阵列天线</text>
<text class="node-sub" x="960.0" y="815.0" text-anchor="middle" fill="#087f8c" font-size="18" data-template="{antenna}">8 × 16 贴片阵列</text>
<text class="node-meta" x="960.0" y="843.0" text-anchor="middle" fill="#536374" font-size="15" data-template="16 路子阵馈电">16 路子阵馈电</text>
</g>
<text x="40" y="56" font-size="29" fill="#152e46">收发链路与 16 通道阵列</text>
<text x="40" y="95" font-size="19" fill="#59697b">TX 沿上行向右 →；RX 沿下行向左 ←；右侧为共用波束赋形链路。</text>
<text x="840" y="929" font-size="19" fill="#59697b">增强方案接收路径绕过 QPA2962；双向连接表示整个收发路由组合，不表示 PA 双向放大。</text>
<text x="40" y="940" font-size="18" fill="#59697b">本振与时钟连接见“时钟与控制”；射频性能及最终频率配置尚需整机确认。</text>
</svg>