<g class="block" data-id="adar" role="button" tabindex="0" aria-label="ADAR1000 ×4，相位 / 增益控制，查看模块详情"><title>ADAR1000 ×4：四个独立 RF 公共支路分别接四片 ADAR1000，每片展开四路收发，连接共 16 片 ADTR1107。</title><rect x="1840" y="740" width="240" height="130" rx="2" fill="white" stroke="#087f8c" stroke-width="1.6"/><path d="M1840 744 H2080" stroke="#087f8c" stroke-width="5"/>
